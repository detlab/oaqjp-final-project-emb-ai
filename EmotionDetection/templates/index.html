<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotion Detector</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #eef2f7;
           margin: 0; padding: 40px 16px; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff;
            border-radius: 12px; padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 42, 90, .12); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p.lead { margin: 0 0 24px; color: #52627a; }
    textarea { width: 100%; height: 96px; padding: 12px; font-size: 15px;
               border: 1px solid #c3ccd9; border-radius: 8px; resize: vertical;
               box-sizing: border-box; }
    button { margin-top: 14px; padding: 11px 22px; font-size: 15px;
             border: 0; border-radius: 8px; background: #1d63d1; color: #fff;
             cursor: pointer; font-weight: 600; }
    button:hover { background: #174ea8; }
    #status { margin-top: 22px; min-height: 24px; font-size: 15px;
              line-height: 1.55; white-space: pre-wrap; }
    .error { color: #b42318; font-weight: 600; }
    .ok { color: #14532d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Emotion Detector</h1>
    <p class="lead">Enter a statement and the application will detect the underlying emotion.</p>
    <textarea id="textToAnalyze" placeholder="I am thrilled about the new release!"></textarea>
    <button id="analyze" type="button">Analyze emotion</button>
    <div id="status"></div>
  </div>
  <script>
    const btn = document.getElementById('analyze');
    const out = document.getElementById('status');
    btn.addEventListener('click', async () => {
      const text = document.getElementById('textToAnalyze').value.trim();
      out.className = '';
      if (!text) {
        out.textContent = 'Invalid text! Please try again!';
        out.className = 'error';
        return;
      }
      out.textContent = 'Analyzing...';
      try {
        const res = await fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text));
        const body = await res.text();
        out.textContent = body;
        out.className = body.startsWith('Invalid') ? 'error' : 'ok';
      } catch (e) {
        out.textContent = 'Invalid text! Please try again!';
        out.className = 'error';
      }
    });
  </script>
</body>
</html>
